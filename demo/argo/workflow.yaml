# The iunctus demo in Argo Workflows: three greetings, each made and shouted by its own step
# (on any node of the cluster), then one report that joins them, made with Python.
# Run it with `iunctus run workflow.yaml`; the report goes to `results/`.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: iunctus-demo-
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: names
        value: '["Ada", "Grace", "Linus"]'
  templates:
    - name: main
      steps:
        - - name: greet
            template: greet
            arguments:
              parameters:
                - name: name
                  value: "{{item}}"
            withParam: "{{workflow.parameters.names}}"
        - - name: shout
            template: shout
            arguments:
              parameters:
                - name: greeting
                  value: "{{item}}"
            withParam: "{{steps.greet.outputs.result}}"
        - - name: report
            template: report
            arguments:
              parameters:
                - name: loud
                  value: "{{steps.shout.outputs.result}}"

    # Prints a greeting and the node that made it.
    - name: greet
      inputs:
        parameters:
          - name: name
      script:
        image: debian:stable-slim
        command: [sh]
        source: |
          printf 'Hello, %s!\ngreeted on %s\n' '{{inputs.parameters.name}}' "$(cat /proc/sys/kernel/hostname)"

    # Shouts the first line of a greeting, and adds the node that shouted it.
    - name: shout
      inputs:
        parameters:
          - name: greeting
      script:
        image: debian:stable-slim
        command: [sh]
        env:
          - name: GREETING
            value: "{{inputs.parameters.greeting}}"
        source: |
          printf '%s\n' "$GREETING" | head -n 1 | tr a-z A-Z
          printf '%s\n' "$GREETING" | tail -n +2
          echo "shouted on $(cat /proc/sys/kernel/hostname)"

    # Joins the shouted greetings into one report, with Python.
    - name: report
      inputs:
        parameters:
          - name: loud
      script:
        image: python:3.13-slim
        command: [python3]
        env:
          - name: LOUD
            value: "{{inputs.parameters.loud}}"
        source: |
          import json, os, pathlib
          texts = sorted(json.loads(os.environ["LOUD"]))
          lines = [f"The iunctus demo in Argo: {len(texts)} greetings", ""]
          for text in texts:
              text = text.splitlines()
              lines.append(f"{text[0]:<14} {', '.join(text[1:])}")
          pathlib.Path("/tmp/report.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
      outputs:
        artifacts:
          - name: report
            path: /tmp/report.txt
            archive:
              none: {}
