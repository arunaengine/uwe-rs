[workspace]
resolver = "3"
members = [
    "workflows/argo/compiler",
    "workflows/argo/parser",
    "workflows/argo/runtime",
    "executors/aws-batch",
    "executors/azure-batch",
    "workflows/galaxy/evaluator",
    "conda-environment",
    "config-file",
    "content-store",
    "workflows/cwl/lowering",
    "workflows/cwl/parser",
    "workflows/cwl/runtime",
    "executors/executor",
    "executors/flyte",
    "workflows/galaxy/parser",
    "workflows/galaxy/runtime",
    "executors/google-batch",
    "executors/htcondor",
    "input-schema",
    "executors/jarvice",
    "uwe",
    "executors/kubernetes",
    "workflows/nextflow/compiler",
    "workflows/nextflow/config",
    "workflows/nextflow/evaluator",
    "workflows/nextflow/parser",
    "workflows/nextflow/plugins",
    "workflows/nextflow/runtime",
    "executors/nomad",
    "executors/pbs",
    "python-evaluator",
    "run-crate",
    "run-database",
    "run-page",
    "run-telemetry",
    "executors/slurm",
    "workflows/snakemake/compiler",
    "workflows/snakemake/parser",
    "workflows/snakemake/runtime",
    "executors/snowflake",
    "storage",
    "task-model",
    "task-runner",
    "executors/tes",
    "tool-definition",
    "tool-record",
    "workflows/wdl/lowering",
    "workflows/wdl/runtime",
    "wir",
    "wir-runtime",
    "workflow-graph",
    "executors/wr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
# Workspace crates
argo-compiler = { path = "workflows/argo/compiler" }
argo-parser = { path = "workflows/argo/parser" }
argo-runtime = { path = "workflows/argo/runtime" }
aws-batch-executor = { path = "executors/aws-batch" }
azure-batch-executor = { path = "executors/azure-batch" }
cheetah-evaluator = { path = "workflows/galaxy/evaluator" }
conda-environment = { path = "conda-environment" }
config-file = { path = "config-file" }
content-store = { path = "content-store" }
cwl-lowering = { path = "workflows/cwl/lowering" }
cwl-parser = { path = "workflows/cwl/parser" }
cwl-runtime = { path = "workflows/cwl/runtime" }
executor = { path = "executors/executor" }
flyte-executor = { path = "executors/flyte" }
galaxy-parser = { path = "workflows/galaxy/parser" }
galaxy-runtime = { path = "workflows/galaxy/runtime" }
google-batch-executor = { path = "executors/google-batch" }
htcondor-executor = { path = "executors/htcondor" }
input-schema = { path = "input-schema" }
jarvice-executor = { path = "executors/jarvice" }
kubernetes-executor = { path = "executors/kubernetes" }
nextflow-compiler = { path = "workflows/nextflow/compiler" }
nextflow-config = { path = "workflows/nextflow/config" }
nextflow-evaluator = { path = "workflows/nextflow/evaluator" }
nextflow-parser = { path = "workflows/nextflow/parser" }
nextflow-plugins = { path = "workflows/nextflow/plugins" }
nextflow-runtime = { path = "workflows/nextflow/runtime" }
nomad-executor = { path = "executors/nomad" }
pbs-executor = { path = "executors/pbs" }
wr-executor = { path = "executors/wr" }
python-evaluator = { path = "python-evaluator" }
run-crate = { path = "run-crate" }
run-database = { path = "run-database" }
run-page = { path = "run-page" }
run-telemetry = { path = "run-telemetry" }
slurm-executor = { path = "executors/slurm" }
snakemake-compiler = { path = "workflows/snakemake/compiler" }
snakemake-parser = { path = "workflows/snakemake/parser" }
snakemake-runtime = { path = "workflows/snakemake/runtime" }
snowflake-executor = { path = "executors/snowflake" }
storage = { path = "storage" }
task-model = { path = "task-model" }
task-runner = { path = "task-runner" }
tes-executor = { path = "executors/tes" }
tool-definition = { path = "tool-definition" }
tool-record = { path = "tool-record" }
wdl-lowering = { path = "workflows/wdl/lowering" }
wdl-runtime = { path = "workflows/wdl/runtime" }
wir = { path = "wir" }
wir-runtime = { path = "wir-runtime" }
workflow-graph = { path = "workflow-graph" }

# Third-party crates
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
# RSA signatures of OCI requests, with the crypto library that rustls already uses.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
bollard = "0.21.1"
oxrdf = "0.3.5"
# Arrow IPC streams in Rust for nf-r-ipc, which exchanges its values with R as one table.
arrow-array = { version = "60.2.0", default-features = false }
arrow-ipc = { version = "60.2.0", default-features = false }
arrow-schema = { version = "60.2.0", default-features = false }
# Parquet files in Rust for nf-parquet, without Arrow; LZ4, Snappy, gzip and zstd pages.
parquet = { version = "60.2.0", default-features = false, features = [
    "flate2-zlib-rs",
    "lz4",
    "snap",
    "zstd",
] }
oxrdfxml = { version = "0.2.5", default-features = false }
oxttl = { version = "0.2.5", default-features = false }
boa_engine = { version = "0.22.0", default-features = false, features = [
    "annex-b",
] }
bytes = "1.12.2"
calamine = "0.38.0"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
fancy-regex = "0.20.2"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false }
granit-parser = "2.2.0"
# Reads the HDF5 files of nf-anndata (`.h5ad`) in Rust: no C library.
hdf5-pure = { version = "0.48.0", default-features = false, features = [
    "std",
    "checksum",
    "deflate",
] }
# Git over HTTPS in Rust, for repository sources and Argo git artifacts: no git program.
gix = { version = "0.91.0", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "sha1",
] }
hmac = "0.13.0"
http = "1.5.0"
indexmap = "2.14.2"
jiff = "1.0.2"
jsonschema = { version = "0.63.1", default-features = false }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.1.0", default-features = false, features = [
    "client",
    "rustls-tls",
    "aws-lc-rs",
] }
# Mail over SMTP with rustls, for the completion e-mail of nf-core-utils: no sendmail program.
# LZ4 blocks inside the Blosc chunks of Zarr stores, for nf-anndata.
lz4_flex = { version = "0.14.2", default-features = false, features = [
    "safe-decode",
    "std",
] }
lettre = { version = "0.11.24", default-features = false, features = [
    "aws-lc-rs",
    "builder",
    "hostname",
    "rustls",
    "rustls-platform-verifier",
    "smtp-transport",
] }
md-5 = { version = "0.11.0", default-features = false }
num-bigint = "0.5.1"
num-traits = "0.2.19"
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
opendal = { version = "0.59.5", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest",
    "layers-retry",
    "services-fs",
    "services-memory",
    "services-s3",
] }
opendal-http-transport-reqwest = "0.59.5"
opendal-service-azblob = { version = "0.59.5", default-features = false }
opendal-service-gcs = { version = "0.59.5", default-features = false }
# A throwaway CA and certificate for tests of TLS servers with their own CA, like wr; tests only.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Reads Galaxy tool XML with the text and tails of its elements.
quick-xml = "0.42.0"
regex = "1.13.2"
regex-syntax = "0.8.12"
rattler_conda_types = "0.58.4"
rattler_solve = { version = "13.0.1", default-features = false, features = [
    "resolvo",
] }
rattler_repodata_gateway = { version = "0.38.5", features = ["gateway"] }
saphyr = "0.4.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "rustls",
] }
reqsign-aws-core = { version = "3.4.0", default-features = false }
reqsign-azure-storage = { version = "3.3.2", default-features = false }
reqsign-core = { version = "3.3.4", default-features = false }
reqsign-file-read-tokio = "3.0.9"
# RS256 signing of the JWTs that exchange a Google service account key for an access token.
rsa = "0.10.0"
ruff_python_ast = "=0.0.23"
ruff_python_parser = "=0.0.23"
ruff_text_size = "=0.0.23"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
rustix = { version = "1.1.6", default-features = false, features = [
    "fs",
    "std",
] }
saphyr-parser = "0.4.0"
# TLS for the iRODS protocol, which starts TLS inside its own connection, checked by the system.
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.4.0"
sha1 = { version = "0.11.0", default-features = false }
# JSON objects keep the order in which keys were added. wdl-analysis needs wdl-modules, which
# turns this on anyway, so every crate gets it; code that needs sorted keys sorts them itself.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# PostgreSQL and MySQL clients in Rust for nf-sqldb, without the sqlx facade, whose optional
# SQLite driver clashes with rusqlite's SQLite. No RSA, so MySQL passwords need TLS.
sqlx-core = { version = "0.9.1", default-features = false, features = [
    "_rt-tokio",
    "_tls-rustls-aws-lc-rs",
    "json",
] }
sqlx-mysql = { version = "0.9.1", default-features = false, features = ["chrono", "json"] }
sqlx-postgres = { version = "0.9.1", default-features = false, features = ["chrono", "json"] }
suppaftp = { version = "13.0.0", default-features = false, features = [
    "tokio",
] }
thiserror = "2.0.21"
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
] }
tokio-rustls = "0.26.6"
tokio-util = "0.7.20"
toml = { version = "1.2.2", default-features = false, features = [
    "parse",
    "std",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-root-certs = "1.0.12"
zstd = { version = "0.14.4", default-features = false }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

# Debug and test builds keep line tables for backtraces only. With full debug info each test
# binary was about 1.2 GB, more than the disk of a hosted CI runner holds for the workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
