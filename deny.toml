[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37 is pinned by oxrdfxml, which has no release for 0.41. uwe parses only local ontology files of at most 16 MiB in cwl-runtime, so the worst case is slow parsing of a workflow's own file." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.37 is pinned by oxrdfxml, which has no release for 0.41. The 16 MiB input limit on local ontology files in cwl-runtime bounds the memory the namespace resolver can use." },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10 fixes this, and the Google Batch and Snowflake executors use it. rsa 0.9 still comes from reqsign-core 3.3.4 and reqsign-azure-storage 3.3.2, the newest releases, through opendal. Both only sign JWTs with a private key. Neither decrypts, and the signing time is not exposed to an attacker." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml comes from serde_yaml in rattler_conda_types, which has no release without it. uwe parses only conda environment files that the user supplies." },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained without a fixed release. It comes from rattler_package_streaming, whose newest release 0.28.6 still needs it; uwe only unpacks conda packages from the channels a run names." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained without a fixed release. It is a compile-time macro crate that wdl-analysis 0.28.1 and wdl-ast 0.27.3, the newest releases, still need; it adds no code that runs." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained without a fixed release. arrow-array and parquet 60.2.0, the newest releases, need it, and so does nf-sqldb, which reads date and time columns through the chrono feature of sqlx-mysql and sqlx-postgres 0.9.1; sqlx has no jiff feature." },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained without a fixed release. It comes only from rattler_repodata_gateway 0.38.5, the newest release, which formats the age of cached repodata with it in a log message." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
