name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [format, clippy, tests, doctests, deny]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install nightly-2026-11-03 --profile minimal --component rustfmt,clippy
      - name: Fetch locked dependencies
        if: matrix.check != 'format'
        run: cargo +1.99.1 fetch --locked
      - name: Formatting
        if: matrix.check == 'format'
        run: cargo +nightly-2026-11-03 fmt --all -- --check
      - name: Style
        if: matrix.check == 'format'
        run: |
          python3 scripts/dev/check_style_tests.py
          python3 -I -m unittest discover -s scripts/tests
          python3 scripts/dev/check_style.py
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo +nightly-2026-11-03 clippy --offline --locked --workspace --all-targets --all-features -j 2 -- -D warnings
      - name: Build native CWL JavaScript helper
        if: matrix.check == 'tests'
        run: |
          docker info
          cargo +1.99.1 build --offline --locked -p uwe -j 2
          python3 scripts/cwl-js-image.py target/debug/uwe
      - name: Workspace tests
        if: matrix.check == 'tests'
        run: cargo +1.99.1 test --offline --locked --workspace --all-targets --all-features -j 2
      - name: Package container run binary
        if: matrix.check == 'tests'
        run: |
          mkdir -p target/container-runs
          cp target/debug/uwe target/container-runs/uwe
          strip target/container-runs/uwe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.check == 'tests'
        with:
          name: container-run-binary
          path: target/container-runs/
          if-no-files-found: error
          retention-days: 1
      - name: Dependency policy
        if: matrix.check == 'deny'
        run: |
          cargo +1.99.1 install --locked cargo-deny --version 0.20.2
          cargo +1.99.1 deny --locked check
      - name: Doctests
        if: matrix.check == 'doctests'
        run: cargo +1.99.1 test --offline --locked --workspace --all-features --doc -j 2

  container-runs:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-run-binary
          path: target/container-runs/
      - name: Pull the single pinned image
        run: |
          docker info
          image=$(python3 -I -c 'import runpy; print(runpy.run_path("scripts/container-runs.py")["IMAGE"])')
          docker pull "$image"
      - name: Container runs
        run: |
          chmod +x target/container-runs/uwe
          nice -n 19 python3 -I scripts/container-runs.py target/container-runs/uwe
