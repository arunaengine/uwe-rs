# Publishes a static Linux build of uwe with checksums and build provenance for each version tag.
# Copyright (c) 2026 The uwe Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/source.yml
  release:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: 0
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check that the tag names the package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          }
      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential musl-tools cmake binutils file
      - name: Build the static binary
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 x86_64-unknown-linux-musl
          cargo +1.99.1 fetch --locked --target x86_64-unknown-linux-musl
          UWE_SOURCE_REVISION="$GITHUB_SHA" cargo +1.99.1 build --release --offline --locked \
            --target x86_64-unknown-linux-musl -p uwe -j 4
          strip --strip-debug target/x86_64-unknown-linux-musl/release/uwe
          file target/x86_64-unknown-linux-musl/release/uwe | grep -Eq 'static(-pie)? linked'
          target/x86_64-unknown-linux-musl/release/uwe --version
      - name: Package
        run: |
          package="uwe-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          mkdir -p "dist/$package"
          cp target/x86_64-unknown-linux-musl/release/uwe README.md LICENSE-MIT LICENSE-APACHE "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          (cd dist && sha256sum "$package.tar.gz" > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "uwe $GITHUB_REF_NAME" --generate-notes --verify-tag
