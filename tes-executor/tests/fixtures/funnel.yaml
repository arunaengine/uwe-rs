# Configures Funnel tests with bounded Docker tasks, local images and no network.
# Only local filesystem storage is enabled.
# Copyright (c) 2026 The iunctus Contributors
# SPDX-License-Identifier: MIT or Apache-2.0
Server:
  HostName: localhost
  HTTPPort: "18000"
  RPCPort: "19090"
Compute: local
Node:
  Resources:
    Cpus: 4
    RamGb: 4
AmazonS3:
  Disabled: true
GoogleStorage:
  Disabled: true
Swift:
  Disabled: true
HTTPStorage:
  Disabled: true
FTPStorage:
  Disabled: true
Worker:
  Container:
    DriverCommand: docker
    RunCommand: run -i --read-only --pull never --memory 1g --network none {{if .RemoveContainer}}--rm{{end}} {{.GetEnvArgs}} {{range $k, $v := .Tags}}--label {{$k}}={{$v}} {{end}} {{if .Name}}--name {{.Name}}{{end}} {{if .Workdir}}--workdir {{.Workdir}}{{end}} {{range .Volumes}}--volume {{.HostPath}}:{{.ContainerPath}}:{{if .Readonly}}ro{{else}}rw{{end}} {{end}} {{.Image}} {{.Command}}
    PullCommand: image inspect {{.Image}}
