[package]
name = "wdl-runtime"
description = "Values, expressions, the standard library, tasks, calls, scatter and conditionals for WDL, as a workflow-graph driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
indexmap.workspace = true
input-schema.workspace = true
regex.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
url = "2.5.8"
# Parsing, imports and type checking of WDL by the Sprocket project. Its engine crate keeps
# expression evaluation private and always builds its own task backends, so uwe evaluates.
wdl-analysis = "0.28.0"
wdl-ast = "0.27.2"
workflow-graph.workspace = true

