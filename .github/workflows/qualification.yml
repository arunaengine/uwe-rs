name: Explicit qualification

on:
  workflow_dispatch:
    inputs:
      corpus_url:
        description: URL of the versioned corpus/oracle tar.gz bundle
        required: true
        type: string
      corpus_sha256:
        description: Exact SHA-256 of that bundle
        required: true
        type: string
  workflow_call:
    inputs:
      corpus_url:
        required: true
        type: string
      corpus_sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    uses: ./.github/workflows/source.yml
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CORPUS_URL: ${{ inputs.corpus_url }}
      CORPUS_SHA256: ${{ inputs.corpus_sha256 }}
      NF_CORE_TEST_WORKFLOWS: ${{ github.workspace }}/corpus/nf-core-text
      UWE_CONFIG_ORACLE: ${{ github.workspace }}/corpus/config-oracle
      SNAKEMAKE_TEST_WORKFLOWS: ${{ github.workspace }}/corpus/snakemake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and verify exact corpus bundle
        run: |
          [[ "$CORPUS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          curl --fail --location --retry 3 --max-time 900 "$CORPUS_URL" -o corpus.tar.gz
          printf '%s  corpus.tar.gz\n' "$CORPUS_SHA256" | sha256sum --check --strict
          mkdir corpus
          tar -xzf corpus.tar.gz -C corpus
          python3 .github/scripts/verify-corpus.py corpus
      - name: Prepare pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: qualification-corpus
      - name: Fetch locked dependencies
        run: cargo +1.99.1 fetch --locked
      - name: Exact Conda corpus outcomes
        run: |
          status=0
          output=$(cargo +1.99.1 test --offline --locked -p conda-environment --test integration -- --ignored --exact test_workflows::reads_workflow_environments 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -Fqx 'test test_workflows::reads_workflow_environments ... ok' <<< "$output"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' <<< "$output"
      - name: Exact config inventory and oracle parity
        run: cargo +1.99.1 test --offline --locked -p uwe --test integration -- --ignored --exact config_test_workflows::matches_oracle
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UWE_CONTAINER_TESTS: '1'
      UWE_ENGINE: docker
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require real Docker and pinned toolchain
        run: |
          docker info
          rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: qualification-container
      - name: Fetch locked dependencies
        run: cargo +1.99.1 fetch --locked
      - name: Real Python package bridge
        run: |
          status=0
          output=$(cargo +1.99.1 test --offline --locked -p snakemake-runtime --test integration -- --ignored --exact python_container::executes_container_packages 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -Fqx 'test python_container::executes_container_packages ... ok' <<< "$output"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' <<< "$output"
