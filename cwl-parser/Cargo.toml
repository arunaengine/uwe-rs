# Manifest of cwl-parser, which loads CWL documents into a typed model.
# Copyright (c) 2026 The iunctus Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

[package]
name = "cwl-parser"
description = "Schema Salad preprocessing, typed model and loader for CWL documents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
granit-parser = { workspace = true }
# Reads documents that `run` and `$import` name by web address, as cwltool does, through the
# storage providers.
storage.workspace = true
# Keeps downloads of callers that name no folder in a private folder that is removed after use.
tempfile.workspace = true

[dev-dependencies]
config-file.workspace = true
