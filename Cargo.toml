# SPDX-License-Identifier: MIT or Apache-2.0

[workspace]
resolver = "3"
members = ["argo-parser", "content-store", "cwl-parser", "cwl-runtime", "executor", "iunctus", "nextflow-config", "nextflow-evaluator", "nextflow-parser", "nextflow-plugins", "nextflow-runtime", "snakemake-parser", "task-model", "task-runner", "workflow-graph"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
# Workspace crates
content-store = { path = "content-store" }
cwl-parser = { path = "cwl-parser" }
executor = { path = "executor" }
nextflow-config = { path = "nextflow-config" }
nextflow-evaluator = { path = "nextflow-evaluator" }
nextflow-parser = { path = "nextflow-parser" }
nextflow-plugins = { path = "nextflow-plugins" }
nextflow-runtime = { path = "nextflow-runtime" }
task-model = { path = "task-model" }
task-runner = { path = "task-runner" }
workflow-graph = { path = "workflow-graph" }

# Third-party crates
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
bytes = "1.12.1"
fancy-regex = "0.19.2"
flate2 = "1.1.10"
granit-parser = "1.3.0"
indexmap = "2.14.2"
jiff = "0.2.37"
jsonschema = { version = "0.58.1", default-features = false }
num-bigint = "0.5.1"
num-traits = "0.2.19"
opendal = { version = "0.59.3", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest",
    "layers-retry",
    "services-fs",
    "services-memory",
    "services-s3",
] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
ruff_python_ast = "=0.0.15"
ruff_python_parser = "=0.0.15"
ruff_text_size = "=0.0.15"
saphyr-parser = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
sha1 = { version = "0.11.0", default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
