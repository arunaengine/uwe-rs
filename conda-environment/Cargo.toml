[package]
name = "conda-environment"
description = "Conda environment files, match specs, the order of conda versions, and locks from the repodata of a local folder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
content-store.workspace = true
serde.workspace = true
serde_json.workspace = true
rattler_conda_types.workspace = true
rattler_solve.workspace = true
rattler_repodata_gateway.workspace = true
reqwest.workspace = true
saphyr.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
sha2.workspace = true
tar.workspace = true
task-model.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
