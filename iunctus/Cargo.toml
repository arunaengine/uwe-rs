[package]
name = "iunctus"
description = "Runs Nextflow, Snakemake, CWL and Argo workflows in containers with a shared, content-addressed cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argo-runtime.workspace = true
conda-environment.workspace = true
config-file.workspace = true
content-store.workspace = true
cwl-runtime.workspace = true
executor.workspace = true
input-schema.workspace = true
jiff.workspace = true
nextflow-evaluator.workspace = true
nextflow-runtime.workspace = true
run-crate.workspace = true
run-database.workspace = true
run-page.workspace = true
run-telemetry.workspace = true
rustix = { workspace = true, features = ["fs", "pipe", "stdio", "termios"] }
serde_json.workspace = true
snakemake-runtime.workspace = true
storage.workspace = true
task-model.workspace = true
task-runner.workspace = true
tempfile.workspace = true
kubernetes-executor.workspace = true
slurm-executor.workspace = true
tes-executor.workspace = true
tokio = { workspace = true, features = ["signal", "sync"] }
workflow-graph.workspace = true

[dev-dependencies]
fancy-regex.workspace = true
