# Workspace manifest: members and shared package settings.
# Copyright (c) 2026 The uwe Contributors
# SPDX-License-Identifier: MIT or Apache-2.0

[workspace]
resolver = "3"
members = [
    "argo-parser",
    "argo-runtime",
    "conda-environment",
    "config-file",
    "content-store",
    "cwl-parser",
    "cwl-runtime",
    "executor",
    "input-schema",
    "uwe",
    "kubernetes-executor",
    "nextflow-config",
    "nextflow-evaluator",
    "nextflow-parser",
    "nextflow-plugins",
    "nextflow-runtime",
    "python-evaluator",
    "run-crate",
    "run-database",
    "run-page",
    "run-telemetry",
    "slurm-executor",
    "snakemake-parser",
    "snakemake-runtime",
    "storage",
    "task-model",
    "task-runner",
    "tes-executor",
    "wdl-runtime",
    "workflow-graph",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
# Workspace crates
argo-parser = { path = "argo-parser" }
argo-runtime = { path = "argo-runtime" }
conda-environment = { path = "conda-environment" }
config-file = { path = "config-file" }
content-store = { path = "content-store" }
cwl-parser = { path = "cwl-parser" }
cwl-runtime = { path = "cwl-runtime" }
executor = { path = "executor" }
input-schema = { path = "input-schema" }
kubernetes-executor = { path = "kubernetes-executor" }
nextflow-config = { path = "nextflow-config" }
nextflow-evaluator = { path = "nextflow-evaluator" }
nextflow-parser = { path = "nextflow-parser" }
nextflow-plugins = { path = "nextflow-plugins" }
nextflow-runtime = { path = "nextflow-runtime" }
python-evaluator = { path = "python-evaluator" }
run-crate = { path = "run-crate" }
run-database = { path = "run-database" }
run-page = { path = "run-page" }
run-telemetry = { path = "run-telemetry" }
slurm-executor = { path = "slurm-executor" }
snakemake-parser = { path = "snakemake-parser" }
snakemake-runtime = { path = "snakemake-runtime" }
storage = { path = "storage" }
task-model = { path = "task-model" }
task-runner = { path = "task-runner" }
tes-executor = { path = "tes-executor" }
wdl-runtime = { path = "wdl-runtime" }
workflow-graph = { path = "workflow-graph" }

# Third-party crates
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
base64 = "0.23.1"
bollard = "0.21.1"
oxrdf = "0.3.4"
oxrdfxml = { version = "0.2.4", default-features = false }
oxttl = { version = "0.2.4", default-features = false }
boa_engine = { version = "0.22.0", default-features = false, features = [
    "annex-b",
] }
bytes = "1.12.1"
calamine = "0.38.0"
fancy-regex = "0.20.0"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false }
granit-parser = "2.1.0"
# Git over HTTPS in Rust, for repository sources and Argo git artifacts: no git program.
gix = { version = "0.90.0", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "sha1",
] }
http = "1.5.0"
indexmap = "2.14.2"
jiff = "0.2.38"
jsonschema = { version = "0.60.2", default-features = false }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.0.0", default-features = false, features = [
    "client",
    "rustls-tls",
    "aws-lc-rs",
] }
md-5 = { version = "0.11.0", default-features = false }
num-bigint = "0.5.1"
num-traits = "0.2.19"
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
opendal = { version = "0.59.4", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest",
    "layers-retry",
    "services-fs",
    "services-memory",
    "services-s3",
] }
opendal-http-transport-reqwest = "0.59.4"
opendal-service-azblob = { version = "0.59.4", default-features = false }
opendal-service-gcs = { version = "0.59.4", default-features = false }
regex = "1.13.1"
regex-syntax = "0.8.11"
rattler_conda_types = "0.58.1"
rattler_solve = { version = "12.0.3", default-features = false, features = [
    "resolvo",
] }
rattler_repodata_gateway = { version = "0.38.1", features = ["gateway"] }
saphyr = "0.3.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "rustls",
] }
reqsign-azure-storage = { version = "3.3.0", default-features = false }
reqsign-core = { version = "3.3.2", default-features = false }
ruff_python_ast = "=0.0.20"
ruff_python_parser = "=0.0.20"
ruff_text_size = "=0.0.20"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
rustix = { version = "1.1.5", default-features = false, features = [
    "fs",
    "std",
] }
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
sha1 = { version = "0.11.0", default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
suppaftp = { version = "12.1.1", default-features = false, features = [
    "tokio",
] }
thiserror = "2.0.21"
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.2", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
] }
tokio-util = "0.7.20"
toml = { version = "1.1.8", default-features = false, features = [
    "parse",
    "std",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-root-certs = "1.0.9"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

# Debug and test builds keep line tables for backtraces only. With full debug info each test
# binary was about 1.2 GB, more than the disk of a hosted CI runner holds for the workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
