[workspace]
resolver = "3"
members = ["nextflow-parser", "task-model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
