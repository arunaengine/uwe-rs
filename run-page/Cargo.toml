[package]
name = "run-page"
description = "The web page of uwe: the graph, the tasks, the logs and the outputs of each run, live"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
content-store.workspace = true
futures-util.workspace = true
run-database.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
task-model.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal", "time"] }
tokio-util = { workspace = true, features = ["io"] }
workflow-graph.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
